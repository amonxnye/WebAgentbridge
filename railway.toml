[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath    = "/health"
healthcheckTimeout = 300
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Environment variables required (set via Railway dashboard or CLI):
#
#   ANTHROPIC_API_KEY   — Claude API key for semantic classification
#   DATABASE_URL        — from Railway PostgreSQL plugin (${{Postgres.DATABASE_URL}})
#   REDIS_URL           — from Railway Redis plugin (${{Redis.REDIS_URL}})
#   PUBLIC_BASE_URL     — your Railway app URL, e.g. https://webbridge.up.railway.app
#   JWT_SECRET          — random secret for signing JWTs (openssl rand -hex 32)
#   PORT                — set by Railway automatically (do NOT override)
